<svg width="320" height="580" viewBox="0 0 320 580" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Can Body Gradient -->
    <linearGradient id="bodyGradLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="15%" stop-color="#2a2a30" />
      <stop offset="35%" stop-color="#18181c" />
      <stop offset="50%" stop-color="#32323a" />
      <stop offset="65%" stop-color="#1a1a1f" />
      <stop offset="85%" stop-color="#2c2c34" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <!-- Accent Aura -->
    <radialGradient id="glowLime" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Rim -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#71717a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#52525b" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="290" r="140" fill="url(#glowLime)" filter="blur(30px)" opacity="0.35" />

  <!-- Can Top Rim (Beveled Aluminum) -->
  <path d="M70 50 C70 38, 250 38, 250 50 L242 70 L78 70 Z" fill="url(#rimGrad)" />
  <ellipse cx="160" cy="46" rx="85" ry="12" fill="#27272a" stroke="#a1a1aa" stroke-width="2" />
  <ellipse cx="160" cy="46" rx="55" ry="6" fill="#18181b" stroke="#71717a" stroke-width="1.5" />
  <!-- Pull Tab -->
  <rect x="154" y="42" width="12" height="18" rx="3" fill="#d4d4d8" />
  <circle cx="160" cy="46" r="3" fill="#18181b" />

  <!-- Can Neck Transition -->
  <path d="M78 70 Q76 90 60 105 L60 490 Q76 505 78 520 L242 520 Q244 505 260 490 L260 105 Q244 90 242 70 Z" fill="url(#bodyGradLime)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

  <!-- Specular Reflection Stripe -->
  <path d="M100 80 L96 510 L115 510 L120 80 Z" fill="#ffffff" fill-opacity="0.08" />

  <!-- Graphic Label Plate -->
  <rect x="75" y="140" width="170" height="300" rx="8" fill="#121215" fill-opacity="0.8" stroke="#a3e635" stroke-opacity="0.4" stroke-width="1" />
  
  <!-- Brand Monogram Stamp -->
  <text x="160" y="210" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="36" letter-spacing="4">CAn</text>
  
  <!-- Accent Line -->
  <line x1="95" y1="230" x2="225" y2="230" stroke="#a3e635" stroke-width="2" />

  <!-- Flavor Titling -->
  <text x="160" y="260" text-anchor="middle" fill="#a3e635" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="2">ELECTRIC LIME</text>
  
  <!-- Specs -->
  <text x="160" y="300" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">450MG IONIC SALTS</text>
  <text x="160" y="320" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">0G SUGAR • 5 CAL</text>
  <text x="160" y="340" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="10">100% RECYCLABLE</text>

  <!-- Bottom Rim -->
  <path d="M78 520 C78 535, 242 535, 242 520 L236 540 C236 550, 84 550, 84 540 Z" fill="url(#rimGrad)" />
</svg>
